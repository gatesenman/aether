[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-lang"
version = "0.6.0"
description = "Aether: a unified agent+human programming language (UI + API + storage from one file)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
aether = "aether.cli:main"

[tool.setuptools]
packages = ["aether"]

[tool.setuptools.package-data]
aether = ["examples/*.ae"]
